plugins { id 'com.android.application' }

android {
    namespace 'com.example.tongpin'
    compileSdk 35
    signingConfigs {
        debug {
            storeFile file("../ci/aevum.keystore")
            storePassword "aevumtest"
            keyAlias "aevum"
            keyPassword "aevumtest"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    defaultConfig {
        applicationId 'com.example.tongpin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}
