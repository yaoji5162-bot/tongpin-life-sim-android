name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent test signing key
        uses: actions/cache@v4
        with:
          path: ci/aevum.keystore
          key: aevum-signing-key-v1
      - name: Create test signing key if needed
        run: |
          mkdir -p ci
          if [ ! -f ci/aevum.keystore ]; then
            keytool -genkeypair -v -keystore ci/aevum.keystore -storepass aevumtest -alias aevum -keypass aevumtest -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aevum Debug, OU=Development, O=Aevum, L=Taihe, ST=Anhui, C=CN"
          fi
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aevum-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
