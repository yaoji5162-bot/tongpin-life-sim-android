name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AEVUM_STORE_PASSWORD: ${{ secrets.AEVUM_STORE_PASSWORD || 'aevumtest' }}
      AEVUM_KEY_ALIAS: ${{ secrets.AEVUM_KEY_ALIAS || 'aevum' }}
      AEVUM_KEY_PASSWORD: ${{ secrets.AEVUM_KEY_PASSWORD || 'aevumtest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set increasing Android version
        run: echo "AEVUM_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Check game and save compatibility
        run: node tests/save.test.cjs
      - name: Restore the existing signing key
        uses: actions/cache/restore@v4
        with:
          path: ci/aevum.keystore
          key: aevum-signing-key-v1
      - name: Use permanent signing backup when configured
        env:
          SIGNING_BACKUP: ${{ secrets.AEVUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_BACKUP" ]; then
            printf '%s' "$SIGNING_BACKUP" | base64 --decode > ci/aevum.keystore
          fi
          if [ ! -s ci/aevum.keystore ]; then
            echo 'Original signing key is missing. Restore AEVUM_KEYSTORE_BASE64; a new key will NOT be generated.'
            exit 1
          fi
      - name: Download previous APK for initial certificate pin
        if: ${{ hashFiles('ci/signing-cert.sha256') == '' }}
        uses: actions/download-artifact@v4
        with:
          name: aevum-android-apk
          run-id: 40059338181
          github-token: ${{ github.token }}
          path: /tmp/aevum-previous
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify original signing identity
        run: |
          previous=()
          if [ ! -f ci/signing-cert.sha256 ]; then previous=(--previous /tmp/aevum-previous/app-debug.apk); fi
          python ci/verify_signing.py --apksigner "${ANDROID_HOME}/build-tools/35.0.0/apksigner" --keystore ci/aevum.keystore "${previous[@]}"
      - name: Prepare launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none app/src/main/assets/aevum-icon.svg -resize 432x432 /tmp/aevum-icon.png
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert /tmp/aevum-icon.png -resize "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build update APK
        run: gradle assembleDebug
      - name: Verify update signature and increasing version
        run: |
          python ci/verify_signing.py --apksigner "${ANDROID_HOME}/build-tools/35.0.0/apksigner" --pin /tmp/aevum-signing-cert.sha256 --apk app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: aevum-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aevum-signing-certificate
          path: /tmp/aevum-signing-cert.sha256
